<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı (404) | ALTN Ne Kadar</title>
    <meta name="robots" content="noindex, follow">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Header -->
    <header class="site-header">

            <a href="/" class="brand-logo">

            <div style="font-size: 64px; color: var(--gold-primary); margin-bottom: 10px;">404</div>
            <h1 style="font-size: 24px; margin-bottom: 10px;">Aradığınız sayfa bulunamadı.</h1>

                <i class="fa-solid fa-house"></i> Ana Sayfaya Dön

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-disclaimer">
